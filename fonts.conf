<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  LangCraft Fontconfig Substitution Matrix
  Aliases proprietary Microsoft Windows Indic fonts to OpenType Google Noto Fonts
  at the Linux OS level for HarfBuzz and Pango rendering.
-->
<fontconfig>
  <!-- 1. Devanagari (Hindi) Mappings -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Mangal</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Nirmala UI</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Aparajita</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Utsaah</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <!-- 2. Sanskrit (Devanagari with Vedic Accents) -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Kokila</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Tiro Devanagari Sanskrit</string>
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <!-- 3. Kannada Mappings -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Tunga</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Kannada</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Kedage</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Kannada</string>
    </edit>
  </match>

  <!-- 4. Telugu Mappings -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Gautami</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Telugu</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Vani</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Telugu</string>
    </edit>
  </match>

  <!-- 5. Tamil Mappings -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Latha</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Tamil</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Vijaya</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans Tamil</string>
    </edit>
  </match>

  <!-- Default Fallback Font Sequence -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Kannada</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Tamil</family>
    </prefer>
  </alias>
</fontconfig>
